name: Browser benchmark

# Measures layerscope end-to-end in a real browser (Chromium via playwright-core):
# cold (first analysis) and warm wall-clock times,
# on synthetic zstd images, a REAL compressible-layer image (an exported alpine
# rootfs recompressed with zstd), the REAL python:3.12-slim rootfs as one layer,
# and a 150 MiB single layer — plus a 300 MiB single layer, a .tar.gz wrapper of
# a docker save, a crafted 17 GiB-FCS refusal fixture, and a repeated-analysis consistency test.
# A legacy docker-save fixture of about 3 GB (sparse zero files, generated on
# the fly — nothing is committed) is built by the fixture steps and uploaded
# through the real file input in Chromium; its numbers are asserted against
# an independent Node reference analysis on the same file.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      big_files_per_layer:
        description: 'files per layer for the ~3 GB big fixture (1000 ≈ 3 GB; 682 ≈ 2 GB; 341 ≈ 1 GB)'
        required: false
        default: '1000'
        type: string

jobs:
  browser-bench:
    name: real-browser cold/warm analysis times
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Build zstd test images
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench
          # deterministic fixtures for the assertion job (test1 = legacy docker-save,
          # test3 = same content as OCI + zstd): 4 layers, wasted 5,652,480 bytes,
          # efficiency ≈ 3.6% — asserted by tools/browser-fixtures.mjs
          # test4-longname.tar: tiny image with a 76-char repoTag, used by the
          # same job to pin the result header (no leakage into "Total size")
          node tools/test-fixtures.mjs --out /tmp/bench
          # REAL compressible layer: export an alpine rootfs, recompress with zstd
          docker pull alpine:3.20
          cid=$(docker create alpine:3.20)
          docker export "$cid" -o /tmp/alpine-rootfs.tar
          docker rm "$cid"
          ls -la /tmp/alpine-rootfs.tar
          node tools/ci/build-zstd-oci.mjs --rootfs /tmp/alpine-rootfs.tar --out /tmp/bench/alpine-rootfs-zstd.tar --tag alpine:3.20
          # pathological case: 62 MiB of incompressible random data, zstd
          node tools/ci/build-incompressible-zstd.mjs --out /tmp/bench/bench64-zstd.tar
          # REAL large image: python:3.12-slim rootfs recompressed as ONE ~119 MB
          # zstd layer (exercises the fallback decode path in Chromium)
          (docker pull mirror.gcr.io/library/python:3.12-slim || docker pull python:3.12-slim)
          cid=$(docker create mirror.gcr.io/library/python:3.12-slim 2>/dev/null || docker create python:3.12-slim)
          docker export "$cid" -o /tmp/python-rootfs.tar
          docker rm "$cid"
          ls -la /tmp/python-rootfs.tar
          node tools/ci/build-zstd-oci.mjs --rootfs /tmp/python-rootfs.tar --out /tmp/bench/python-rootfs-zstd.tar --tag python:3.12-slim > /tmp/python-zstd.json
          node -e "const j=require('/tmp/python-zstd.json'); console.log('::notice::python-rootfs-zstd uncompressedLayerBytes=' + j.uncompressedLayerBytes + ' zstdLayerBytes=' + j.zstdLayerBytes + ' archiveBytes=' + j.archiveBytes + ' ratio=' + j.ratio)"
          # 150 MiB incompressible SINGLE layer (tested size above the python fixture)
          node tools/ci/build-incompressible-zstd.mjs --out /tmp/bench/zstd-1x150.tar --layers 1 --size-mib 150
          # 300 MiB incompressible SINGLE layer — above the old 160 MiB fallback limit;
          # must analyze successfully end to end (asserted in the fixture job)
          node tools/ci/build-incompressible-zstd.mjs --out /tmp/bench/zstd-1x300.tar --layers 1 --size-mib 300
          # tiny crafted archive whose zstd layer DECLARES 17 GiB uncompressed (8-byte FCS) —
          # the default 8 GiB fallback ceiling refusal must fire BEFORE decoding
          node tools/ci/build-crafted-fcs.mjs --out /tmp/bench/crafted-fcs-huge.tar
          # .tar.gz wrapper of a docker save (test1 fixture built above) — the analysis
          # in Chromium must produce numbers identical to the unwrapped fixture
          gzip -c /tmp/bench/test1-waste.tar > /tmp/bench/test1-waste.tar.gz
          ls -la /tmp/bench/test1-waste.tar.gz
          # 12-layer incompressible zstd image (~120 MiB uncompressed) — repeated-analysis consistency test in ONE tab
          node tools/ci/build-incompressible-zstd.mjs --out /tmp/bench/bench12-zstd.tar --layers 12 --per-mib 10
          # soak layer + tiny soak image: deterministic 3 MiB payload (mulberry32 seed 7)
          node --input-type=module -e "
            import { mulberry32 } from './tools/synth-lib.mjs';
            import zlib from 'node:zlib';
            import { writeFileSync } from 'node:fs';
            import { createHash } from 'node:crypto';
            const rand = mulberry32(7);
            const content = Buffer.alloc(3 * 1024 * 1024);
            for (let i = 0; i < content.length; i++) content[i] = (rand() * 256) | 0;
            const frame = zlib.zstdCompressSync(content, { params: { [zlib.constants.ZSTD_c_compressionLevel]: 3 } });
            writeFileSync('./soak-layer.zst', frame); // served at /soak-layer.zst for the tab to fetch
            console.log('::notice::soak layer frame bytes=' + frame.length + ' sha256(uncompressed)=' + createHash('sha256').update(content).digest('hex'));
            const { synthesizeRawAsync } = await import('./tools/synth-lib.mjs');
            const buf = await synthesizeRawAsync({ format: 'oci-save', compression: 'zstd', layers: [[{ name: 'data/big.bin', content, mode: 0o644 }]], history: [{ created_by: 'RUN dd if=/dev/urandom of=/data/big.bin' }], repoTag: 'layerscope/soak:latest' });
            writeFileSync('/tmp/bench/soak-zstd.tar', buf);
          "
          ls -la /tmp/bench

      - name: Install Chromium (playwright-core)
        run: npx playwright-core install --with-deps chromium

      - name: Serve the site and measure cold/warm analysis in real Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8321/index.html
          node tools/browser-bench.mjs --url http://127.0.0.1:8321 \
            --image /tmp/bench/alpine-rootfs-zstd.tar \
            --image /tmp/bench/bench64-zstd.tar \
            --image /tmp/bench/python-rootfs-zstd.tar \
            --image /tmp/bench/zstd-1x150.tar \
            --image /tmp/bench/zstd-1x300.tar
          EXPECTED_SHA=$(node --input-type=module -e "import{mulberry32}from'./tools/synth-lib.mjs';import{createHash}from'node:crypto';const r=mulberry32(7);const b=Buffer.alloc(3*1024*1024);for(let i=0;i<b.length;i++)b[i]=(r()*256)|0;console.log(createHash('sha256').update(b).digest('hex'))")
          node tools/browser-soak.mjs --url http://127.0.0.1:8321 --image /tmp/bench/soak-zstd.tar --layer-url /soak-layer.zst --expected-sha256 "$EXPECTED_SHA" --iterations 2000 --analyses 50
          node tools/browser-limit.mjs --url http://127.0.0.1:8321 --image /tmp/bench/crafted-fcs-huge.tar
          node tools/browser-soak.mjs --url http://127.0.0.1:8321 --image /tmp/bench/bench12-zstd.tar --skip-phase-a --analyses 20

      # runs after the bench above (shared Chromium install, same staged site root)
      # ~3 GB legacy docker-save fixture for the browser fixture job: sparse
      # file-bodies (holes), generated in seconds, nothing committed.
      - name: Build the ~3 GB legacy docker-save big fixture (sparse zeros)
        run: node tools/ci/build-big-legacy.mjs --out /tmp/bench/big-legacy.tar --files-per-layer "${{ github.event.inputs.big_files_per_layer || '1000' }}"

      # independent reference analysis: same src/core/analyze.js code path as
      # the browser, on a fs-backed Blob; writes /tmp/bench/big-expected.json
      - name: Reference analysis of the big fixture (node)
        run: node tools/ci/analyze-big.mjs /tmp/bench/big-legacy.tar --json /tmp/bench/big-expected.json && cat /tmp/bench/big-expected.json

      - name: Serve the site and assert fixture numbers in real Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/http-fix.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8321/index.html
          node tools/browser-fixtures.mjs --url http://127.0.0.1:8321 \
            --test1 /tmp/bench/test1-waste.tar \
            --test3 /tmp/bench/test3-zstd.tar \
            --longname /tmp/bench/test4-longname.tar

      # ~3 GB fixture uploaded through the real file input (desktop viewport).
      # Asserts the analysis finishes, zero console/page errors, and the
      # layers/total/wasted/reclaimable/efficiency numbers equal the node
      # reference analysis on the same file. RSS is not exposed to the page;
      # peak JS heap is sampled in-page every 200 ms.
      # If this step fails, the engine is NOT to be "fixed" here — see the
      # PR body/report. Large sizes can be probed with:
      #   gh workflow run browser-bench.yml --ref <branch> -f big_files_per_layer=682   # ~2 GB
      #   gh workflow run browser-bench.yml --ref <branch> -f big_files_per_layer=341   # ~1 GB
      - name: Serve the site and assert the ~3 GB big fixture in real Chromium (desktop)
        run: |
          set -euo pipefail
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/http-big.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8321/index.html
          node tools/browser-big.mjs --url http://127.0.0.1:8321 \
            --image /tmp/bench/big-legacy.tar \
            --expected /tmp/bench/big-expected.json \
            --metrics-out /tmp/bench/metrics-big-legacy.json

      # node reference for the 300 MiB single-layer fixture (fs-backed Blob;
      # same src/core/analyze.js code path as the browser)
      - name: Reference analysis of the 300 MiB single layer (node)
        run: node tools/ci/analyze-big.mjs /tmp/bench/zstd-1x300.tar --json /tmp/bench/zstd-1x300-expected.json && cat /tmp/bench/zstd-1x300-expected.json

      # 300 MiB single zstd layer — above the old 160 MiB fallback limit; must
      # analyze end to end with browser numbers identical to the node reference
      - name: Serve the site and assert the 300 MiB single layer in real Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/http-300.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8321/index.html
          node tools/browser-big.mjs --url http://127.0.0.1:8321 \
            --image /tmp/bench/zstd-1x300.tar \
            --expected /tmp/bench/zstd-1x300-expected.json \
            --metrics-out /tmp/bench/metrics-zstd-1x300.json

      # .tar.gz wrapper of a docker save — the in-browser analysis of the wrapped
      # archive must render numbers identical to the unwrapped fixture
      - name: Serve the site and assert the .tar.gz wrapper self-consistency in real Chromium
        run: |
          set -euo pipefail
          python3 -m http.server 8321 --bind 127.0.0.1 >/tmp/http-wrapper.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS -o /dev/null http://127.0.0.1:8321/index.html
          node tools/browser-wrapper.mjs --url http://127.0.0.1:8321 \
            --image /tmp/bench/test1-waste.tar \
            --wrapped /tmp/bench/test1-waste.tar.gz

      # real browser metrics for the 300 MiB layer + the ~3 GB fixture
      # (downloaded by maintainers with `gh run download <id> -n browser-metrics`)
      - name: Upload browser metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-metrics
          path: /tmp/bench/metrics-*.json
          if-no-files-found: ignore
