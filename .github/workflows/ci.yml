name: CI

on: [push, pull_request]

jobs:
  unit:
    name: unit tests + verification against dive's goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Smoke test the UI (jsdom)
        run: npm run smoke

      - name: Decoder soak (2000× decompress sha256-verified + 50 analyses)
        run: node tools/soak-zstd.mjs --iterations 2000 --analyses 50

      - name: Verify layerscope against dive's committed golden files
        # The committed goldens (internal/imagefixture/testdata/golden/*.export.json)
        # exist only on dive's main branch (introduced in dive#727, the stereoscope
        # port). v0.13.1 — and every earlier tag — has no internal/imagefixture
        # tree, so cloning a tag would silently skip this check. We pin the exact
        # upstream commit the goldens were verified against instead of a moving
        # branch head. When dive releases a tag containing the golden suite,
        # switch this pin to that tag.
        run: |
          git init -q /tmp/dive-src
          git -C /tmp/dive-src remote add origin https://github.com/wagoodman/dive
          git -C /tmp/dive-src fetch -q --depth 1 origin e97febbeb6956b11f679f6d823762752185e3fef
          git -C /tmp/dive-src checkout -q FETCH_HEAD
          DIVE_REPO=/tmp/dive-src node tools/verify-fixtures.mjs

  samples:
    name: sample images vs the real dive CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build sample images and save archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/layerscope-samples /tmp/samples
          for name in clean add-delete overwrite multi-waste; do
            docker build --no-cache -t "layerscope-samples/${name}" "samples/${name}"
            docker save -o "/tmp/samples/${name}.tar" "layerscope-samples/${name}"
          done

      - name: Install dive v0.13.1
        run: |
          curl -fsSL -o /tmp/dive.tar.gz \
            https://github.com/wagoodman/dive/releases/download/v0.13.1/dive_0.13.1_linux_amd64.tar.gz
          tar -xzf /tmp/dive.tar.gz -C /tmp
          chmod +x /tmp/dive
          /tmp/dive --version

      - name: Analyze images with dive (docker daemon)
        run: |
          set -euxo pipefail
          mkdir -p /tmp/out
          # Load the exact archives produced by `docker save` into the daemon,
          # then analyze with dive's canonical source (docker daemon).
          for name in clean add-delete overwrite multi-waste; do
            docker load -i "/tmp/samples/${name}.tar"
          done
          for name in clean add-delete overwrite multi-waste; do
            /tmp/dive --json "/tmp/out/${name}.dive.json" "layerscope-samples/${name}"
          done

      - name: Analyze archives with layerscope
        run: |
          set -euo pipefail
          for name in clean add-delete overwrite multi-waste; do
            node tools/analyze.mjs "/tmp/samples/${name}.tar" --json "/tmp/out/${name}.layerscope.json"
          done

      - name: Compare layerscope against dive (must match exactly)
        run: |
          set -euo pipefail
          for name in clean add-delete overwrite multi-waste; do
            echo "::group::${name}"
            node tools/compare.mjs "/tmp/out/${name}.dive.json" "/tmp/out/${name}.layerscope.json"
            echo "::endgroup::"
          done

      - name: dive --ci passes on the clean sample
        run: /tmp/dive --ci layerscope-samples/clean

      - name: dive --ci rejects the wasteful samples (expected)
        run: |
          # Default rules fail below 0.9 efficiency / above 10% user-wasted bytes.
          # These three samples are wasteful by design, so dive exits non-zero.
          # This step never fails the build; it only reports dive's verdict.
          for name in add-delete overwrite multi-waste; do
            if /tmp/dive --ci "layerscope-samples/${name}"; then
              echo "::warning::dive --ci unexpectedly passed on ${name} (alpine base may have changed sizes)"
            else
              echo "dive --ci rejected ${name} as expected"
            fi
          done
  real-images:
    name: real public images vs the real dive CLI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm ci

      - name: Install dive v0.13.1
        run: |
          curl -fsSL -o /tmp/dive.tar.gz \
            https://github.com/wagoodman/dive/releases/download/v0.13.1/dive_0.13.1_linux_amd64.tar.gz
          tar -xzf /tmp/dive.tar.gz -C /tmp
          chmod +x /tmp/dive
          /tmp/dive --version

      - name: Pull real images, docker save, compare vs dive (every diff printed; tolerances unloosened)
        run: DIVE=/tmp/dive tools/check-real-images.sh

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-images-outputs
          path: /tmp/layerscope-real-images
          if-no-files-found: warn

